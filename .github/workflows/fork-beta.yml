name: Fork beta
# Nightly: upstream dev + this fork's commits -> the fork's beta branch, the update channel the installed PoB reads.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  beta:
    runs-on: ubuntu-24.04
    steps:
      - name: Set line endings
        run: git config --global core.autocrlf true
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Merge upstream dev
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/PathOfBuildingCommunity/PathOfBuilding.git dev
          echo "UPSTREAM=$(git rev-parse --short FETCH_HEAD)" >> "$GITHUB_ENV"
          git merge --no-edit FETCH_HEAD
      - name: Build manifest
        run: |
          sed -i "s/<Version number=\"\([^\"]*\)\"/<Version number=\"\1-$UPSTREAM\"/" manifest.xml
          python3 update_manifest.py --quiet --in-place
          sed -i "s#PathOfBuildingCommunity/PathOfBuilding#$GITHUB_REPOSITORY#g" manifest.xml
      # beta keeps its own history without .github, so pushing it never needs the workflows permission
      - name: Push beta
        run: |
          git worktree add --detach ../beta
          cd ../beta
          if git fetch -q origin beta; then git checkout -q -B beta FETCH_HEAD; else git checkout -q --orphan beta && git rm -rqf .; fi
          rsync -a --delete --exclude .git --exclude .github "$GITHUB_WORKSPACE"/ ./
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -qm "Beta $(grep -o 'Version number="[^"]*"' manifest.xml)"
          git push origin beta
